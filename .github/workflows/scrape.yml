name: Check for new documents
on:
  schedule:
    - cron: "30 0 * * *"   # 06:30 Bangladesh time
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .scrape-cache
          key: scrape-cache-${{ github.run_id }}
          restore-keys: scrape-cache-
      - run: npm run scrape
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # LGED packages verified by text (union + upazila) are published directly.
      - name: Publish verified LGED tenders
        if: hashFiles('.scrape-cache/auto-published') != ''
        run: |
          git config user.name "jonotar-khata-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/documents_auto.csv data/projects_auto.csv data/tenders_auto.csv public/archive/lged
          npm test
          git commit -m "data: auto-publish LGED tenders for Katuli Union, Tangail Sadar"
          git push
          gh workflow run deploy.yml --ref main
          rm .scrape-cache/auto-published
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: scraper/new-documents
          delete-branch: true
          title: "নতুন নথি পাওয়া গেছে — যাচাই করুন"
          body-path: scrape-summary.md
          commit-message: "data: new documents found by the daily scraper"
          add-paths: |
            data/documents.csv
            data/tenders.csv
            data/budget_lines.csv
            public/archive/2*/**
